<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Shto / Ndrysho Kafe</title>
</head>
<body>
<h2 th:text="${coffee.id != null} ? 'Ndrysho Kafenë' : 'Shto Kafe të Re'"></h2>
<form th:action="@{/admin/coffees/save}" th:object="${coffee}" method="post">
    <input type="hidden" th:field="*{id}"/>
    <label for="name">Emri:</label>
    <input type="text" id="name" th:field="*{name}" required/><br><br>
    <label for="description">Përshkrimi:</label><br>
    <textarea id="description" th:field="*{description}" rows="4" cols="40" required></textarea><br><br>
    <label for="price">Çmimi (€):</label>
    <input type="number" step="0.01" id="price" th:field="*{price}" required/><br><br>
    <label for="origin">Origjina:</label>
    <input type="text" id="origin" th:field="*{origin}" required/><br><br>
    <label for="intensityOfCoffee">Intensiteti i Kafesë:</label>
    <select id="intensityOfCoffee" th:field="*{intensityOfCoffee}" required>
        <option value="">Zgjidh...</option>
        <option value="E lehtë">E lehtë</option>
        <option value="Mesatare">Mesatare</option>
        <option value="E fortë">E fortë</option>
    </select><br><br>
    <button type="submit">Ruaj</button>
</form>
<br>
<a th:href="@{/admin/coffees}">⟵ Kthehu te lista</a>
</body>
</html>
