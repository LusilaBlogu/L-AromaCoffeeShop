<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Paneli i Porosive - Admin</title></head>
<body>
<h2>Porositë Aktuale</h2>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Kafe</th>
        <th>Madhësia</th>
        <th>Sasia</th>
        <th>Pagesa</th>
        <th>Shtesat</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="order : ${orders}">
        <td th:text="${order.id}"></td>
        <td th:text="${order.coffee.name}"></td>
        <td th:text="${order.size}"></td>
        <td th:text="${order.quantity}"></td>
        <td th:text="${order.paymentMethod}"></td>
        <td>
            <span th:if="${order.extraMilk}">Qumësht </span>
            <span th:if="${order.extraSugar}">Sheqer </span>
            <!-- Shto të tjerat -->
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
